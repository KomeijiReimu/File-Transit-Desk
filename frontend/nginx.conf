map $uri $capability_safe_uri {
  default $uri;
  ~^/t/[^/]+(?<capability_suffix>/.*)?$ "/t/[redacted]${capability_suffix}";
}

log_format capability_safe '$remote_addr [$time_local] "$request_method $capability_safe_uri $server_protocol" '
                           '$status $body_bytes_sent $request_time';

server {
  listen 80;
  server_name _;
  client_max_body_size 10g;
  # 所有 3600s 均表示“连续无 I/O 进展”的空闲超时，不是请求或传输的固定总时长。
  client_body_timeout 3600s;
  send_timeout 3600s;
  access_log /var/log/nginx/access.log capability_safe;
  error_log /var/log/nginx/error.log crit;
  add_header Referrer-Policy "no-referrer" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:17878/api/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /t/ {
    proxy_pass http://backend:17878/t/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
