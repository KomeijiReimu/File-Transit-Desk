server:
  host: "0.0.0.0"
  port: 17878
  # 仅在可信反向代理后启用；启用后审计和登录限速会读取 X-Forwarded-For / X-Real-IP。
  trust_proxy_headers: false
database:
  path: "./data/filetrans.db"
auth:
  # 必须替换为自己的 Base32 TOTP secret。保持占位符会导致服务拒绝启动。
  totp_secret: "REPLACE_WITH_YOUR_BASE32_SECRET"
  # 仅本地开发可改为 true；且仅当 totp_secret 为空时允许验证码 000000。
  dev_allow_fixed_code: false
  # 会话绝对最长有效期；到期后必须重新登录。
  session_ttl_seconds: 86400
  # 用户无活动超过该时间后视为空闲过期；前端只在可见且有操作时发送心跳续期。
  idle_timeout_seconds: 180
  # 心跳恢复宽限期；普通 API 不使用宽限，只有 heartbeat 可在短暂超时后续期。
  idle_grace_seconds: 30
  cookie_secure: false
  admin:
    username: "REPLACE_WITH_ADMIN_USERNAME"
    # 管理员密码的 sha256 hex。生成：python3 scripts/hash-admin-password.py
    password_sha256: "REPLACE_WITH_ADMIN_PASSWORD_SHA256"
web:
  static_dir: "../frontend/dist"
downloads:
  # 下载票据有效期。点击下载时先兑换票据，长下载和 Range 续传不再依赖页面会话。
  lease_ttl_seconds: 7200
  # 下载票据最大有效期上限，防止误配置过长。
  lease_max_ttl_seconds: 21600
  # 对不超过该大小的文件写入 SHA-256 内容哈希并在每次票据下载前复核；0 表示所有文件都做内容哈希。
  content_hash_max_mb: 64
cors:
  allow_origins:
    - "http://localhost:5173"
storage:
  # 整个请求体上限；后端 Fiber BodyLimit 也使用该值。
  upload_max_mb: 512
  # 单个文件上限，必须小于等于 upload_max_mb。
  upload_max_file_mb: 512
  # 单次 multipart 请求最多允许的文件数量。
  upload_max_files: 20
  # 白名单非空时，只允许这些扩展名；示例： [".zip", ".txt", ".pdf"]。
  allowed_extensions: []
  # 黑名单优先级高于白名单；默认清空，管理员可在 Web 配置管理页按需添加。
  blocked_extensions: []
  dirs:
    - id: "default"
      name: "Default"
      type: "directory"
      path: "./uploads"
      allow_download: true
      allow_upload: true
  # 管理员也可在前端“配置管理”页维护目录和单文件资源；单文件资源只允许下载。
  shares: []
file_picker:
  # 文件选择器默认提供系统入口；roots 仅作为常用位置快捷方式。
  roots:
    - id: "uploads"
      name: "上传目录"
      path: "./uploads"
      allow_select_files: true
      allow_select_dirs: true
      show_hidden: false
      follow_symlinks: false
  # 单页最多返回的条目数；接口会强制裁剪前端传入的 pageSize。
  max_page_size: 200
  deny_names: []
  deny_patterns: []
tokens:
  default_ttl_seconds: 3600
  # 单个上传令牌的累计上传容量；0 表示不限制。
  upload_max_mb: 1024
audit:
  retain: 1000
