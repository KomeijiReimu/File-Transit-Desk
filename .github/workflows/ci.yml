name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/server
      - name: Cross-compile Windows server
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go test -c -o /tmp/file-trans-server.test.exe ./internal/server
          go build -o /tmp/file-trans-server.exe ./cmd/server

  backend-windows-config:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # fsutil/config 不依赖 SQLite/CGO，单独作为 Windows 路径与原子保存语义门禁。
      - run: go test ./internal/fsutil ./internal/config

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - name: Build frontend container
        run: docker build -t file-trans-frontend:ci .
      - name: Validate frontend nginx configuration
        run: docker run --rm --add-host backend:127.0.0.1 file-trans-frontend:ci nginx -t
      - name: Assert capability-safe nginx log format
        run: |
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("nginx.conf").read_text()
          match = re.search(r"log_format\s+capability_safe\s+(.*?);", text, re.S)
          if not match:
              raise SystemExit("missing capability_safe log format")
          fmt = match.group(1)
          forbidden = [r"\$request(?!_)", r"\$request_uri", r"\$args", r"\$http_referer", r"\$http_authorization"]
          for pattern in forbidden:
              if re.search(pattern, fmt, re.I):
                  raise SystemExit(f"sensitive nginx log variable found: {pattern}")
          required = ["$remote_addr", "$time_local", "$request_method", "$capability_safe_uri", "$server_protocol", "$status", "$body_bytes_sent", "$request_time"]
          missing = [item for item in required if item not in fmt]
          if missing:
              raise SystemExit(f"missing safe log fields: {missing}")
          if re.search(r"\bworker_shutdown_timeout\b", text):
              raise SystemExit("nginx must not impose a finite worker_shutdown_timeout")
          PY
      - name: Verify capability values are redacted from nginx access log
        run: |
          set -euo pipefail
          network="capability-log-test"
          upstream="capability-upstream"
          frontend="capability-frontend"
          cleanup() {
            docker rm -f "$frontend" "$upstream" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          docker run -d --name "$upstream" --network "$network" --network-alias backend python:3.12-alpine python -m http.server 17878 >/dev/null
          docker run -d --name "$frontend" --network "$network" -p 18080:80 file-trans-frontend:ci >/dev/null
          headers="$(mktemp)"
          for _ in $(seq 1 30); do
            if curl -sS -D "$headers" -o /dev/null "http://127.0.0.1:18080/"; then
              break
            fi
            sleep 1
          done
          if ! grep -Eiq '^Referrer-Policy:[[:space:]]*no-referrer' "$headers"; then
            cat "$headers"
            exit 1
          fi
          curl -sS -o /dev/null "http://127.0.0.1:18080/t/known-secret-token/download?lease=known-secret-lease"
          curl -sS -o /dev/null "http://127.0.0.1:18080/t/known-secret-nosuffix?lease=known-nosuffix-lease"
          curl -sS -o /dev/null "http://127.0.0.1:18080/api/files/download-by-lease?lease=known-api-lease"
          sleep 1
          logs="$(docker logs "$frontend" 2>&1)"
          if [[ "$logs" == *"known-secret-token"* || "$logs" == *"known-secret-lease"* || "$logs" == *"known-secret-nosuffix"* || "$logs" == *"known-nosuffix-lease"* || "$logs" == *"known-api-lease"* ]]; then
            printf '%s\n' "$logs"
            exit 1
          fi
          if ! grep -Eq 'GET /t/\[redacted\]/download HTTP/[0-9.]+" [0-9]{3} [0-9]+ [0-9.]+' <<<"$logs"; then
            printf '%s\n' "$logs"
            exit 1
          fi
          if ! grep -Eq 'GET /t/\[redacted\] HTTP/[0-9.]+" [0-9]{3} [0-9]+ [0-9.]+' <<<"$logs"; then
            printf '%s\n' "$logs"
            exit 1
          fi
          if ! grep -Eq 'GET /api/files/download-by-lease HTTP/[0-9.]+" [0-9]{3} [0-9]+ [0-9.]+' <<<"$logs"; then
            printf '%s\n' "$logs"
            exit 1
          fi

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check shell syntax
        run: bash -n scripts/dev.sh
      - name: Test password helper script
        run: python -m unittest discover -s scripts -p 'test*.py'
      - name: Check whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...HEAD"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero_sha" ]] && git cat-file -e "${BEFORE_SHA}^{commit}"; then
            git diff --check "${BEFORE_SHA}..HEAD"
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi
      - name: Validate Compose configuration
        run: docker compose -f backend/docker-compose.example.yml config --quiet
      - name: Build backend container
        run: docker build -t file-trans-backend:ci backend
